syntax = "proto3";

package table_populator;

service TablePopulatorService {
  // Populates a SurrealDB table with structured data generated by Rig/Gemini from a prompt.
  // Sets the table's COMMENT to the prompt for provenance.
  rpc PopulateTable (PopulateTableRequest) returns (PopulateTableResponse);

  // Retrieves schema information, field definitions, and COMMENT (prompt) for a table.
  rpc GetTableInfo (GetTableInfoRequest) returns (GetTableInfoResponse);

  // Lists all defined tables in the SurrealDB database.
  rpc ListTables (ListTablesRequest) returns (ListTablesResponse);

  // Executes arbitrary SurrealQL query.
  rpc ExecuteSurrealQl (ExecuteSurrealQlRequest) returns (ExecuteSurrealQlResponse);
}

message PopulateTableRequest {
  // The natural language prompt / query for data extraction
  string prompt = 1;
  // Target SurrealDB table name
  string table_name = 2;
  // Optional SurrealDB namespace override (defaults to config)
  optional string namespace = 3;
  // Optional SurrealDB database override (defaults to config)
  optional string database = 4;
  // Optional SurrealQL DDL, e.g. "DEFINE TABLE books SCHEMAFULL; DEFINE FIELD title ON TABLE books TYPE string;"
  optional string define_table_sql = 5;
  // Optional Gemini model override
  optional string model = 6;
  // Optional model temperature override
  optional double temperature = 7;
  // Optional system preamble override
  optional string preamble = 8;
  // Whether to enable Google Search grounding for real-time web data extraction (default: true)
  optional bool enable_grounding = 9;
}

message PopulateTableResponse {
  bool success = 1;
  string table_name = 2;
  uint64 records_count = 3;
  // JSON array string of all records inserted
  string data_json = 4;
  // The prompt/comment saved on the table
  string table_comment = 5;
  // The schema / field definitions in JSON format
  string table_schema_json = 6;
  string message = 7;
}

message GetTableInfoRequest {
  string table_name = 1;
  optional string namespace = 2;
  optional string database = 3;
}

message GetTableInfoResponse {
  string table_name = 1;
  string comment = 2;
  string schema_json = 3;
  repeated string fields = 4;
}

message ListTablesRequest {
  optional string namespace = 1;
  optional string database = 2;
}

message ListTablesResponse {
  repeated string tables = 1;
}

message ExecuteSurrealQlRequest {
  string sql = 1;
  optional string namespace = 2;
  optional string database = 3;
}

message ExecuteSurrealQlResponse {
  bool success = 1;
  string result_json = 2;
  string message = 3;
}
