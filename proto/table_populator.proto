syntax = "proto3";

package table_populator;

service TablePopulatorService {
  // Populates a SurrealDB table with structured data generated by Rig/Gemini from a prompt.
  // Sets the table's COMMENT to the prompt for provenance.
  rpc PopulateTable (PopulateTableRequest) returns (PopulateTableResponse);

  // Retrieves schema information, field definitions, and COMMENT (prompt) for a table.
  rpc GetTableInfo (GetTableInfoRequest) returns (GetTableInfoResponse);

  // Lists all defined tables in the SurrealDB database.
  rpc ListTables (ListTablesRequest) returns (ListTablesResponse);

  // Executes arbitrary SurrealQL query.
  rpc ExecuteSurrealQl (ExecuteSurrealQlRequest) returns (ExecuteSurrealQlResponse);

  // Populates a table iteratively over a date range and interval (daily, weekly, monthly, yearly).
  rpc PopulateTableInterval (PopulateTableIntervalRequest) returns (PopulateTableIntervalResponse);

  // Streaming variant that streams each iteration result as it completes.
  rpc PopulateTableIntervalStream (PopulateTableIntervalRequest) returns (stream IntervalIterationResult);
}

message PopulateTableRequest {
  // The natural language prompt / query for data extraction
  string prompt = 1;
  // Target SurrealDB table name
  string table_name = 2;
  // Optional SurrealDB namespace override (defaults to config)
  optional string namespace = 3;
  // Optional SurrealDB database override (defaults to config)
  optional string database = 4;
  // Optional SurrealQL DDL, e.g. "DEFINE TABLE books SCHEMAFULL; DEFINE FIELD title ON TABLE books TYPE string;"
  optional string define_table_sql = 5;
  // Optional Gemini model override
  optional string model = 6;
  // Optional model temperature override
  optional double temperature = 7;
  // Optional system preamble override
  optional string preamble = 8;
  // Whether to enable Google Search grounding for real-time web data extraction (default: true)
  optional bool enable_grounding = 9;
  // Optional list of table columns/fields to omit from the schema sent to the model.
  // Fields omitted here will NOT be instructed or requested from the LLM, allowing
  // SurrealDB DEFAULT values (e.g. status DEFAULT 'Pending', fetched_at DEFAULT time::now())
  // or downstream foreign keys (e.g. crime_id) to apply automatically without LLM hallucination.
  repeated string omit_fields = 10;
  // Optional thinking level for reasoning-capable Gemini models: "minimal", "low", "medium", "high" (default: "low" when grounding is enabled)
  optional string thinking_level = 11;
}

message PopulateTableResponse {
  bool success = 1;
  string table_name = 2;
  uint64 records_count = 3;
  // JSON array string of all records inserted
  string data_json = 4;
  // The prompt/comment saved on the table
  string table_comment = 5;
  // The schema / field definitions in JSON format
  string table_schema_json = 6;
  string message = 7;
}

message GetTableInfoRequest {
  string table_name = 1;
  optional string namespace = 2;
  optional string database = 3;
}

message GetTableInfoResponse {
  string table_name = 1;
  string comment = 2;
  string schema_json = 3;
  repeated string fields = 4;
}

message ListTablesRequest {
  optional string namespace = 1;
  optional string database = 2;
}

message ListTablesResponse {
  repeated string tables = 1;
}

message ExecuteSurrealQlRequest {
  string sql = 1;
  optional string namespace = 2;
  optional string database = 3;
}

message ExecuteSurrealQlResponse {
  bool success = 1;
  string result_json = 2;
  string message = 3;
}

message PopulateTableIntervalRequest {
  // Base prompt template (supports {{timeframe}}, {{date}}, or dynamic injection)
  string prompt = 1;
  // Target SurrealDB table name
  string table_name = 2;
  // Interval stepping: "daily" / "dayly", "weekly", "monthly", "yearly"
  string interval = 3;
  // Start date (e.g. "2000-01-01", "2000-01", "2000")
  string start_date = 4;
  // End date (e.g. "2000-12-31", "2000-12", "2000")
  string end_date = 5;
  // Optional SurrealDB namespace override (defaults to config)
  optional string namespace = 6;
  // Optional SurrealDB database override (defaults to config)
  optional string database = 7;
  // Optional SurrealQL DDL to execute on the first iteration
  optional string define_table_sql = 8;
  // Optional Gemini model override
  optional string model = 9;
  // Optional model temperature override
  optional double temperature = 10;
  // Optional system preamble override
  optional string preamble = 11;
  // Whether to enable Google Search grounding for real-time web data extraction (default: true)
  optional bool enable_grounding = 12;
  // Optional list of table columns/fields to omit from the schema sent to the model and insertion payload
  repeated string omit_fields = 13;
  // Optional thinking level for reasoning-capable Gemini models: "minimal", "low", "medium", "high" (default: "low" when grounding is enabled)
  optional string thinking_level = 14;
}

message IntervalIterationResult {
  // Human-readable timeframe label (e.g. "2000-01", "2000-01-01 to 2000-01-07")
  string timeframe = 1;
  string start_date = 2;
  string end_date = 3;
  bool success = 4;
  uint64 records_count = 5;
  string message = 6;
  string data_json = 7;
}

message PopulateTableIntervalResponse {
  bool success = 1;
  string table_name = 2;
  uint64 total_records_count = 3;
  uint32 completed_iterations = 4;
  uint32 failed_iterations = 5;
  repeated IntervalIterationResult iterations = 6;
  string message = 7;
}

